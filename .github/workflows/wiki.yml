name: Update wiki

permissions:
  contents: write
  
on:
  push:

jobs:
  set_wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Echos
        run: |
          echo Message : ${{ github.event.head_commit.message }}
          echo Repo actuel : ${{ github.repository }}
          echo "NOW=$(date +'%d%/m/%Y %H:%M:%S')" >> $GITHUB_ENV
          echo Date : $NOW
 
      - name: Get Wiki
        uses: actions/checkout@v3
        with:
           repository: ${{ github.repository }}.wiki
           path: wiki
		  
      - name: Update wiki
        run: |
          #!/bin/sh
          
          cd wiki
          echo | Date  | Commentaire | > tmp.md
          echo | ------------- | ------------- | >>tmp.md
          echo | $NOW | ${{ github.event.head_commit.message }} | >>tmp.md 
 
          tail -n +2 Home.md >>tmp.md
  
          rm Home.md
          mv tmp.md Home.md

          git commit -m ""
          git push
